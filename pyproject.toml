[project]
name = "rfp-intelligence"
version = "0.1.0"
description = "RFP Intelligence Platform: RAG search engine + multi-agent system for bid documents"
readme = "README.md"
authors = [
    { name = "Vishakha Bhardwaj", email = "vishakhabhardwaj147@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "trafilatura>=2.2.0",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rfp"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]