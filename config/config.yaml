# Tunable settings. Secrets go in .env, never here.
bids_dir: data/bids # /index only accepts folders inside this
processed_dir: data/processed
chunking:
  target_tokens: 500 # aim for this many tokens per chunk
  max_tokens: 650 # hard ceiling (tables and overlap may approach it)
  min_tokens: 80 # a chunk smaller than this absorbs the next section instead of ending
  overlap_tokens: 80 # trailing sentences repeated at the start of the next chunk
search:
  dense_model: BAAI/bge-small-en-v1.5
  dense_dim: 384
  sparse_model: Qdrant/bm25
  qdrant_path: data/index/qdrant # embedded Qdrant, no server needed
  collection: rfp_chunks
  manifest_path: data/index/manifest.json
  rerank_model: Xenova/ms-marco-MiniLM-L-6-v2 # alt: BAAI/bge-reranker-base (bigger, slower)
  retrieve_k: 30 # candidates from each of dense and sparse
  rrf_k: 60 # standard RRF constant
  sparse_weight: 1.0
  identifier_sparse_weight: 2.0 # when the query contains IDs like JA-207652
  rerank_include_header: false # the header helps dense/BM25 but confused the MiniLM reranker
llm:
  timeout_s: 60 # per request
  max_tokens: 2048 # output limit per call
  temperature: null # extraction should be deterministic
  validation_retries: 2 # re-asks when the model's JSON fails validation
  prices: # USD per million tokens - from Anthropic's pricing page (checked 2026-10-03)
    claude-haiku-4-5-20251001: {input_per_mtok: 1.0, output_per_mtok: 5.0, cache_write_per_mtok: 1.25, cache_read_per_mtok: 0.10}
    claude-sonnet-5-5: {input_per_mtok: 2.0, output_per_mtok: 10.0, cache_write_per_mtok: 2.50, cache_read_per_mtok: 0.20}
agents:
  per_query_k: 5 # results kept from each search query
  per_field_k: 5 # evidence chunks kept per field after fusing its queries
  extraction_tier: fast # fast = Haiku, smart = Sonnet
  validator_tier: smart # the fact-check needs careful reading
  max_field_retries: 2 # validator -> re-extraction attempts per field
  rerank_candidates: 12 # agent searches rerank fewer candidates than interactive search (30)
