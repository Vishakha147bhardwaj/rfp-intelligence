# Tunable settings. Secrets go in .env, never here.

chunking:
  target_tokens: 500 # aim for this many tokens per chunk
  max_tokens: 650 # hard ceiling (tables and overlap may approach it)
  min_tokens: 80 # a chunk smaller than this absorbs the next section instead of ending
  overlap_tokens: 80 # trailing sentences repeated at the start of the next chunk
search:
  dense_model: BAAI/bge-small-en-v1.5
  dense_dim: 384
  sparse_model: Qdrant/bm25
  qdrant_path: data/index/qdrant # embedded Qdrant, no server needed
  collection: rfp_chunks
  manifest_path: data/index/manifest.json
  rerank_model: Xenova/ms-marco-MiniLM-L-6-v2 # alt: BAAI/bge-reranker-base (bigger, slower)
  retrieve_k: 30 # candidates from each of dense and sparse
  rrf_k: 60 # standard RRF constant
  sparse_weight: 1.0
  identifier_sparse_weight: 2.0 # when the query contains IDs like JA-207652
