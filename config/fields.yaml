# The 20 fields extracted for every bid. Agents are driven entirely by this file.
#   group:       which specialist extraction agent handles it
#   format:      datetime | date | text | list | contact   (the validator checks this)
#   queries:     search queries the retrieval agent runs for this field
#   addendum_sensitive: addendums may change it -> reconciliation agent re-checks it
#   generated:   produced by the report agent from other fields, not extracted

groups:
  dates_logistics: Dates, deadlines, meetings, contract term, delivery
  commercial_legal: Identifiers, issuer, contact, bonds, payment, required documents, contracts
  product_specs: Products, quantities, models, part numbers, specifications, installation

fields:
  - name: Bid Number
    group: commercial_legal
    format: text
    description: Official solicitation / RFP identifier.
    hints: >-
      Prefer the identifier printed on the RFP document itself (e.g. an RFP or PORFP number).
      Put other identifiers (portal reference numbers, project numbers) in notes.
    queries:
      [
        solicitation number,
        RFP number,
        bid number,
        PORFP number,
        reference number,
      ]

  - name: Title
    group: commercial_legal
    format: text
    description: Full title of the bid or RFP.
    hints: Use the title as written on the RFP or portal page, without portal decorations.
    queries: [title of the solicitation, request for proposal title]

  - name: Due Date
    group: dates_logistics
    format: datetime
    addendum_sensitive: true
    description: Final submission deadline including time and time zone.
    hints: >-
      Report date AND time AND time zone exactly as written. If several documents state a due
      date, report each in your reasoning; the latest addendum decides the final value later.
    queries:
      [
        submission deadline,
        proposals due date and time,
        closing date,
        solicitation due,
      ]

  - name: Bid Submission Type
    group: dates_logistics
    format: text
    description: How the bid is submitted (electronic portal, sealed paper, email, etc.).
    hints: Name the channel and portal or address if stated.
    queries:
      [
        how to submit proposal,
        submission method,
        submit electronically,
        sealed bids,
      ]

  - name: Term of Bid
    group: dates_logistics
    format: text
    addendum_sensitive: true
    description: Contract duration and any renewal options.
    hints: >-
      The length of the contract or agreement and its renewals. NOT how long a proposal or quote
      must remain valid, and NOT a warranty period. If no contract term is stated, return null.
    queries: [contract term, length of contract, renewal options, initial term]

  - name: Pre Bid Meeting
    group: dates_logistics
    format: text
    addendum_sensitive: true
    description: Date, time, location and whether attendance is mandatory, or "None".
    hints: Answer "None" only if the documents explicitly say there is no meeting.
    queries: [pre-bid meeting, pre-proposal conference, prebid conference date]

  - name: Delivery Date
    group: dates_logistics
    format: text
    addendum_sensitive: true
    description: Required delivery date or delivery window after award.
    hints: >-
      Only delivery timing (a date, a number of days after award, or a schedule). Do not include
      warranty, repair or service terms.
    queries: [delivery date, delivery within days of award, shipping lead time]

  - name: Bid Bond Requirement
    group: commercial_legal
    format: text
    addendum_sensitive: true
    description: Required bid bond or security, amount or percentage, or "Not required".
    hints: Answer "Not required" only if the documents explicitly say so; otherwise null.
    queries:
      [bid bond, bid security, bid guarantee, surety bond, performance bond]

  - name: Payment Terms
    group: commercial_legal
    format: text
    description: Payment terms (e.g. Net 30) and invoicing conditions.
    queries: [payment terms, invoicing instructions, net 30, invoice submission]

  - name: Any Additional Documentation Required
    group: commercial_legal
    format: list
    description: Affidavits, forms, certificates, insurance, W-9, etc. that the bidder must provide.
    hints: One list item per document. Include when it is due (with bid / upon award) if stated.
    queries:
      [
        required forms and affidavits,
        documents to submit with proposal,
        W9 form,
        certificate of insurance,
      ]
    evidence_k: 10

  - name: MFG for Registration
    group: commercial_legal
    format: list
    description: Manufacturer(s) the bidder must be registered or authorized with.
    queries:
      [
        authorized reseller,
        manufacturer authorization,
        letter of authorization,
        manufacturer name,
      ]

  - name: Contract or Cooperative to use
    group: commercial_legal
    format: text
    description: Referenced cooperative or state contract vehicle, if any.
    queries:
      [master contract, cooperative contract, piggyback, contract vehicle]

  - name: contact_info
    group: commercial_legal
    format: contact
    description: Procurement contact - name, email, phone.
    hints: >-
      The person named as Buyer or Procurement Officer for THIS solicitation (usually on the cover
      or first pages). NOT M/WBE, HUB, compliance, insurance or legal department contacts. Format
      "Name | email | phone". Never combine one person's name with another office's phone or
      email - if the buyer's phone is not given, write "not stated".
    queries:
      [
        buyer name email,
        procurement officer contact,
        buyer contact phone,
        point of contact for questions,
      ]

  - name: company_name
    group: commercial_legal
    format: text
    description: Issuing organization / agency name.
    queries: [issuing organization, agency name, school district]

  - name: Model_no
    group: product_specs
    format: list
    description: Model number(s) of the requested product(s).
    hints: >-
      Manufacturer model names or numbers (e.g. "Latitude 5550", "WD22TB4"). Agency catalog codes
      such as "SI#" numbers belong in reasoning, not in the value.
    queries: [model number, product model, laptop model]

  - name: Part_no
    group: product_specs
    format: list
    expand_neighbors: true
    id_patterns:
      - '(?<![\w-])\d{3}-[A-Z0-9]{4}(?![\w-])' # Dell-style SKU: 210-BLYZ, 362-7806
    description: Part / SKU number(s) of the requested product(s).
    hints: >-
      List EVERY SKU or part number in the evidence, exactly as printed - do not skip or summarise
      any. Do not invent or reformat them.
    queries: [part number, SKU, item number]

  - name: Product
    group: product_specs
    format: list
    evidence_k: 8
    expand_neighbors: true
    neighbor_window: 3
    description: Product name(s) and quantity.
    hints: >-
      One item per product, formatted "Name - quantity". Quantities are often in pricing or
      line-item tables; estimated quantities count - write e.g. "Display Monitor - Touch - 5,000
      (estimated)". Write "quantity not stated" only if no line item gives one.
    queries:
      [
        products requested quantity,
        required functionality product name qty,
        pricing lines estimated quantity,
        line item unit each,
      ]

  - name: Product Specification
    group: product_specs
    format: list
    description: Key technical specifications (CPU, RAM, storage, display, warranty, etc.).
    hints: One item per spec, e.g. "RAM - 16 GB DDR5". Include warranty requirements.
    queries:
      [
        processor memory storage display specifications,
        minimum hardware requirements,
        warranty,
      ]

  - name: Installation
    group: product_specs
    format: text
    description: Whether installation, deployment or imaging services are required.
    hints: >-
      State whether the RFP requires installation, deployment, imaging or setup services. If only a
      vendor quote lists factory installation items, say exactly that.
    queries:
      [
        installation services,
        deployment imaging,
        white glove services,
        setup,
        factory install,
      ]

  - name: Bid Summary
    group: product_specs
    format: text
    generated: true
    description: A concise 3-6 sentence summary of the bid, generated from the other fields.
    queries: []
