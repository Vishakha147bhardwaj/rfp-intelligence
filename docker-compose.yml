services:
  api:
    build: .
    image: rfp-intelligence
    ports:
      - "8000:8000"
    env_file: .env              # ANTHROPIC_API_KEY etc. (copy .env.example to .env first)
    volumes:
      - ./data:/app/data        # bids + search index, kept on your machine
      - ./outputs:/app/outputs
      - ./runs:/app/runs
      - models:/models          # embedding / reranker / OCR models, downloaded once

  ui:
    image: rfp-intelligence
    command: ["uv", "run", "--no-sync", "streamlit", "run", "ui/app.py",
              "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      - RFP_API_URL=http://api:8000   # the API container, by its service name
    ports:
      - "8501:8501"
    volumes:
      - ./outputs:/app/outputs
      - ./runs:/app/runs
    depends_on:
      - api

volumes:
  models:
